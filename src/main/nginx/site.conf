# Generated by jwebmp-angular:build: website-owned config, copied on every build.
# TLS terminates at Azure Container Apps ingress. Never redirect its internal HTTP hop.
map $request_uri $site_route {
    default "";
    ~^/(?:\?.*)?$ home;
    ~^/index.html(?:\?.*)?$ home;
    ~^/home/?(?:\(aside:home\))?(?:\?.*)?$ home;
    ~^/getting-started/?(?:\(aside:getting-started\))?(?:\?.*)?$ getting-started;
    ~^/guides/end-to-end/?(?:\(aside:guides/end-to-end\))?(?:\?.*)?$ guides/end-to-end;
    ~^/capabilities/?(?:\(aside:capabilities\))?(?:\?.*)?$ capabilities;
    ~^/modules/?(?:\(aside:modules\))?(?:\?.*)?$ modules;
    ~^/services/?(?:\(aside:services\))?(?:\?.*)?$ services;
    ~^/cloud/?(?:\(aside:cloud\))?(?:\?.*)?$ cloud;
    ~^/environment-variables/?(?:\(aside:environment-variables\))?(?:\?.*)?$ environment-variables;
    ~^/builder/?(?:\?.*)?$ builder;
    ~^/releases/?(?:\?.*)?$ releases;
}

server {
    listen 80;
    server_name guicedee.com www.guicedee.com;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/plain text/markdown application/json application/xml application/manifest+json;

    if ($host = www.guicedee.com) { return 308 https://guicedee.com$request_uri; }
    if ($http_x_forwarded_proto = http) { return 308 https://guicedee.com$request_uri; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/markdown text/css application/javascript application/json application/xml;

    location = /favicon.ico { return 308 /guicedee-logo.svg; }

    # Only content-hashed application bundles are immutable.
    location ~* /(?:main|chunk|polyfills|scripts|styles)-[A-Za-z0-9_-]+\.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:txt|md|xml|json|webmanifest)$ {
        types { text/plain txt; text/markdown md; application/xml xml; application/json json; application/manifest+json webmanifest; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header Link '</llms.txt>; rel="describedby"';
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        # Inject canonical links before JavaScript executes; preserve the original request route.
        sub_filter_once on;
        sub_filter '</head>' '<link rel="canonical" href="https://guicedee.com/$site_route"><link rel="alternate" type="text/markdown" href="https://guicedee.com/$site_route.md"><meta property="og:url" content="https://guicedee.com/$site_route"></head>';
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri @application;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }
    location @application {
        if ($site_route = "") { return 404; }
        rewrite ^ /index.html last;
    }
}
